[package]
name = "ospivot-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "ospivot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2" }
